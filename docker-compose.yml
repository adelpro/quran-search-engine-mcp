services:
  quran-mcp:
    build: .
    container_name: quran-search-engine-mcp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '127.0.0.1:4000:4000'
    mem_limit: 256m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
